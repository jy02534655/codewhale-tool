<!DOCTYPE html>
<html lang="zh-Hans" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeWhale Tool — 配置管理</title>
  <!-- 双主题基础样式：普通（亮色） / 暗黑 -->
  <style>
    /* ─── 亮色主题（默认）──────────────────────────────────── */
    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f6f8fa;
      --bg-tertiary: #e8eaed;
      --border: #d0d7de;
      --text-primary: #1f2328;
      --text-secondary: #656d76;
      --accent: #0969da;
      --accent-hover: #0550b5;
      --success: #1a7f37;
      --danger: #cf222e;
      --warning: #9a6700;
      --radius: 6px;
    }

    /* ─── 暗黑主题 ──────────────────────────────────────────── */
    [data-theme="dark"] {
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --bg-tertiary: #21262d;
      --border: #30363d;
      --text-primary: #e6edf3;
      --text-secondary: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #79c0ff;
      --success: #3fb950;
      --danger: #f85149;
      --warning: #d29922;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
